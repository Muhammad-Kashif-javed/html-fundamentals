<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <h2>Signup</h2>
    <form action="">
        <label >Username:</label> <br>
        <input type="text" placeholder="Enter username" required>
        <br><br>
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter username" required> <br><br>
        <!-- The for attribute in <label> connects a label to a specific form field.
        Witout this works, but the label is not linked to the input.-->
        <label for="email">Email:</label> <br>
        <input type="email" id="email" placeholder="Enter email" required> <br><br>
        <label for="confirm-password">Confirm Password:</label><br>
        <input type="password" id="confirm-password" placeholder="Repeat password" required>
        <input type="checkbox" id="remember">
        <label for="remember">Remember Me</label>
        <!-- 
        <input type="checkbox">
        <label >Remember Me</label>
        we can also use this
        -->
        <p>Select Gender:</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>
        <!--FOR WE USE  FOR JAVASCRIPT FOR BACKEND TO STOREDATA-->


        <label>Select Role:</label>
        <select>
            <option value="">--select role--</option>
            <option value="user">user</option>
            <option value="admin">admin</option>
        </select>
        <br><br>

        <input type="submit" value="singup">
    </form>

    <p>Have account? <a href="login.html">Login here</a></p>

</body>
</html>
